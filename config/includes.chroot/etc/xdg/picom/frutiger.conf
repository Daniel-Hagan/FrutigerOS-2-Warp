# Frutiger OS — picom: Aero glass blur behind translucent frames, panel, dock and menus.
backend = "glx";
vsync = true;
use-damage = true;

# Games & video: when a fullscreen window covers the screen, picom steps aside
# (no blur, no extra frame of latency). Also skip windows that ask for it.
unredir-if-possible = true;
unredir-if-possible-exclude = [];
detect-client-opacity = true;

blur: { method = "dual_kawase"; strength = 6; };
blur-background = true;
blur-background-frame = true;
blur-background-fixed = false;
blur-background-exclude = [
  "window_type = 'desktop'",
  "_GTK_FRAME_EXTENTS@:c",
  "class_i = 'frutiger-orbit'",
  "class_i = 'frutiger-aquarium'",
  "class_i = 'frutiger-leafshelf'",
  "class_i = 'frutiger-cloudbar'",
  "class_i = 'frutiger-beads'",
  "class_i = 'frutiger-ribbon'",
  "class_i = 'frutiger-sundial'",
  "class_i = 'frutiger-lilypond'",
  "class_i = 'frutiger-sidebar'"
];

# xfwm4 frames become translucent glass
frame-opacity = 0.82;
inactive-opacity-override = false;

shadow = true;
shadow-radius = 16;
shadow-opacity = 0.45;
shadow-offset-x = -14;
shadow-offset-y = -8;
shadow-exclude = [
  "window_type = 'desktop'",
  "window_type = 'dock'",
  "class_g = 'Plank'",
  "class_i = 'frutiger-orbit'",
  "class_i = 'frutiger-aquarium'",
  "class_i = 'frutiger-leafshelf'",
  "class_i = 'frutiger-cloudbar'",
  "class_i = 'frutiger-beads'",
  "class_i = 'frutiger-ribbon'",
  "class_i = 'frutiger-sundial'",
  "class_i = 'frutiger-lilypond'",
  "class_i = 'frutiger-sidebar'",
  "class_i = 'frutiger-flip'",
  "_GTK_FRAME_EXTENTS@:c"
];

fading = true;
fade-in-step = 0.07;
fade-out-step = 0.07;

wintypes: {
  tooltip = { fade = true; shadow = true; opacity = 0.96; focus = true; };
  dock = { shadow = false; };
  dnd = { shadow = false; };
  popup_menu = { opacity = 0.97; };
  dropdown_menu = { opacity = 0.97; };
};
