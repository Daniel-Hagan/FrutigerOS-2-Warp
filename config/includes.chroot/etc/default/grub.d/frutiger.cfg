# Frutiger OS boot menu on the installed system (read by update-grub).
GRUB_DISTRIBUTOR="Frutiger"
GRUB_THEME=/usr/share/grub/themes/frutiger/theme.txt
GRUB_GFXMODE=auto
GRUB_GFXPAYLOAD_LINUX=keep

# Show the "Choose how to start" menu only when it's useful:
#  - another OS on the disk (e.g. Windows dual-boot) -> show the menu for 5 s
#  - Frutiger OS alone -> skip straight to the boot splash.
#    Press Esc (or hold Shift on older PCs) during startup to bring the menu up
#    anyway, e.g. for recovery mode.
if command -v os-prober >/dev/null 2>&1 && [ -n "$(os-prober 2>/dev/null)" ]; then
  GRUB_DISABLE_OS_PROBER=false
  GRUB_TIMEOUT_STYLE=menu
  GRUB_TIMEOUT=5
else
  GRUB_TIMEOUT_STYLE=hidden
  GRUB_TIMEOUT=1
fi
