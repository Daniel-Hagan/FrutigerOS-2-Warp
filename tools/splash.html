<script>
const r=n=>{let x=Math.sin(n*9301+49297)*233280;return x-Math.floor(x)};

d.style.cssText=`width:${s}px;height:${s}px;left:${r(i+50)*100}%;top:${55+r(i+99)*45}%;opacity:${.4+r(i+7)*.6}`;document.body.appendChild(d)}
